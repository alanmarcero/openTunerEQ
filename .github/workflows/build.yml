name: Build and validate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ARTEFACTS: build/openTunerEQ_artefacts/Release
jobs:
  core:
    if: false
    name: DSP · Linux + sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build-core -DOTE_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        run: |
          cmake --build build-core --parallel 2
          ctest --test-dir build-core --output-on-failure
  macos:
    if: false
    name: macOS · Universal VST3 + AU
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Core and processor tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openTunerEQ.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openTunerEQ.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openTunerEQ.app"
      - name: Validate VST3 with pluginval
        run: |
          curl --fail --location --silent --show-error -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openTunerEQ.vst3"
      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openTunerEQ.vst3" dist/openTunerEQ.vst3
          ditto "$ARTEFACTS/AU/openTunerEQ.component" dist/openTunerEQ.component
          ditto "$ARTEFACTS/Standalone/openTunerEQ.app" dist/openTunerEQ.app
          python3 scripts/package_notices.py dist
          ditto -c -k dist openTunerEQ-macOS-universal.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openTunerEQ-macOS-universal
          path: openTunerEQ-macOS-universal.zip
          if-no-files-found: error
  windows:
    name: Windows · x64 VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Core and processor tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval.zip SHA-256 mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openTunerEQ.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openTunerEQ.vst3" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openTunerEQ.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openTunerEQ-Windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openTunerEQ-Windows-x64
          path: openTunerEQ-Windows-x64.zip
          if-no-files-found: error
  update-preview:
    name: Update editor preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libfreetype6-dev libfontconfig1-dev libasound2-dev \
            libgl1-mesa-dev libglu1-mesa-dev xvfb fonts-dejavu-core
      - name: Build the plugin tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target plugin_tests --parallel
      - name: Render the factory-default editor
        run: xvfb-run -a build/plugin_tests --preview docs/screenshots/preview.png
      - name: Commit the preview when it changes
        run: |
          git add -- docs/screenshots/preview.png
          if git diff --cached --quiet; then
            echo "Editor preview is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh editor preview"
          git pull --rebase origin main
          git push origin HEAD:main
  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.core.result == 'skipped' || needs.core.result == 'success') && (needs.macos.result == 'skipped' || needs.macos.result == 'success') }}
    needs: [core, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Notes are the CHANGELOG section for this version (## [1.2.3] or ## v1.2.3),
      # or the annotated tag message. The screenshot and compare link follow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openTunerEQ-*
          path: dist
          merge-multiple: true
      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --output release_notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/openTunerEQ-*.zip
          body_path: release_notes.md
