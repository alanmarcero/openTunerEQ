name: Build and validate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ARTEFACTS: build/openTunerEQ_artefacts/Release
jobs:
  core:
    name: DSP · Linux + sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-core -DOTE_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test
        run: |
          cmake --build build-core --parallel 2
          ctest --test-dir build-core --output-on-failure
  macos:
    name: macOS · Universal VST3 + AU
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Core and processor tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openTunerEQ.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openTunerEQ.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openTunerEQ.app"
      - name: Validate VST3 with pluginval
        run: |
          curl --fail --location --silent --show-error -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openTunerEQ.vst3"
      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openTunerEQ.vst3" dist/openTunerEQ.vst3
          ditto "$ARTEFACTS/AU/openTunerEQ.component" dist/openTunerEQ.component
          ditto "$ARTEFACTS/Standalone/openTunerEQ.app" dist/openTunerEQ.app
          cp README.md LICENSE dist/
          ditto -c -k dist openTunerEQ-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openTunerEQ-macOS-universal
          path: openTunerEQ-macOS-universal.zip
          if-no-files-found: error
  windows:
    name: Windows · x64 VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Core and processor tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openTunerEQ.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openTunerEQ.vst3" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openTunerEQ.exe" dist/
          Copy-Item README.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath openTunerEQ-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openTunerEQ-Windows-x64
          path: openTunerEQ-Windows-x64.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openTunerEQ-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: openTunerEQ-*.zip
          generate_release_notes: true
